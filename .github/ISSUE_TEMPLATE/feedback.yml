name: ゲームへの意見・フィードバック
description: 感想・要望・不具合報告。絵を新しく描き起こす必要がある要望は「画像生成をともなう要望」の方へ。
title: "[意見] "
labels: ["feedback"]
body:
  - type: markdown
    attributes:
      value: |
        遊んでいただきありがとうございます。気づいた点を自由に書いてください。
        できるだけ「どの場面で・何が・どうなってほしいか」を具体的に書いていただけると反映しやすいです。

        **答えが決まっていない相談(この作りでよいか、どちらの案がよいか等)は
        「コンサル希望」をお使いください。**毎週水曜14:00以降にまとめて回答します。

        **新しい敵やアイコンなど「絵を新しく生成する」必要がある要望は、
        ひとつ上の「画像生成をともなう要望」をお使いください。**
        生成コストを見積もるため、一覧で区別できるようにしています。
  - type: dropdown
    id: category
    attributes:
      label: 種類
      options:
        - 不具合(バグ)
        - バランス調整(難易度・お金・速度など)
        - 操作感(カメラ・移動・照準など)
        - 見た目・3Dモデル・UI
        - 新要素・仕様の要望
        - その他
    validations:
      required: true
  - type: textarea
    id: detail
    attributes:
      label: 内容
      description: 具体的に。例「始まりの島で食料が早く減りすぎて漁が間に合わない」「カメラをもっと引きたい」など。
      placeholder: ここに記入
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: 再現手順(不具合の場合・任意)
      placeholder: |
        1. 出港する
        2. ○○すると
        3. △△になる
  - type: input
    id: version
    attributes:
      label: 試したバージョン/コミット(任意)
      placeholder: 例) 2026-06-27 の最新
