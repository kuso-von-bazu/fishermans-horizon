name: 製作を依頼(各種エディタなど)
description: ゲーム本体ではなく「作業を助ける道具」を作ってほしいときはこちら。データ編集用エディタ、検証ツール、一覧の出力など。通常の意見とは別枠で、まとめて着手します。
title: "[製作] "
labels: ["製作依頼"]
body:
  - type: markdown
    attributes:
      value: |
        **ゲームに付属する道具を新しく作ってほしい**ときはこちらへお願いします。
        (例: 敵のパラメータをまとめて編集できるエディタ / 島や航路を見ながら組めるマップ編集画面 /
        船団を組んで強さを試算するツール / 全実績・全敵の一覧を出力する仕組み など)

        ゲームの中身そのものの修正・追加は
        「ゲームへの意見・フィードバック」の方が早く反映されます。

        ---

        **着手の時期について**
        製作依頼は、**通常の意見とは別に、開発側の都合のよいタイミングで**着手します。
        普段の意見のように随時反映されるわけではないのでご了承ください。
        道具は一度作ると長く使うため、設計を練ってから作る枠です。
        急ぎの不具合や単純な修正依頼は通常の意見としてお出しください。
  - type: dropdown
    id: tool_kind
    attributes:
      label: 作ってほしいものの種類
      options:
        - データを編集する道具(敵・船・魚・実績などのパラメータ編集)
        - 配置を編集する道具(島・航路・出現位置などのマップ編集)
        - 試算・検証する道具(船団の強さ、バランスの当たりを見る)
        - 一覧・集計を出す道具(表やファイルとして書き出す)
        - 制作を助ける道具(絵・音の生成や加工まわり)
        - その他
    validations:
      required: true
  - type: textarea
    id: detail
    attributes:
      label: 作ってほしいもの
      description: どんな道具がほしいか。画面のイメージや、扱いたいデータが分かると助かります。
      placeholder: |
        例) 敵の一覧を表で開いて、HP・攻撃力・速度をその場で書き換えられる画面がほしい。
            書き換えたらゲーム側のデータに反映されるようにしてほしい。
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: 今どうしているか・なぜ必要か
      description: 今の手間が分かると、どこを楽にすべきかを外しません。
      placeholder: |
        例) 数値を変えたいときは毎回issueで依頼しており、結果を見るまで時間がかかる。
            自分で少しずつ動かして試したい。
    validations:
      required: true
  - type: textarea
    id: how_to_use
    attributes:
      label: 使い方の希望(任意)
      description: どこで動かしたいか。分からなければ空欄で構いません(こちらで決めます)。
      placeholder: |
        例) ブラウザで開きたい / パソコンでバッチをダブルクリックして起動したい /
            スマホからも見たい / ゲーム内のメニューから開きたい
  - type: textarea
    id: note
    attributes:
      label: 補足(任意)
      placeholder: 参考にしてほしい既存のツール、扱えると嬉しいデータ、譲れない条件など
